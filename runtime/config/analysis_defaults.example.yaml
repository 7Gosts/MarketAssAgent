# 跨资产默认参数（模板）
# 复制为 runtime/config/analysis_defaults.yaml 后在本地按需修改。

# 均线系统（按资产板块）
ma_system:
  crypto:
    short: 8
    mid: 21
    long: 55
  equity:
    short: 13
    mid: 34
    long: 89

# 通用 LLM 提供商配置（统一 agent 主模型入口）
llm:
  default_provider: "deepseek"
  providers:
    deepseek:
      env_prefix: "DEEPSEEK"
      base_url: "https://api.deepseek.com"
      model: "deepseek-v4-flash"
      api_key: "替换为你自己的api key"
    openai:
      env_prefix: "OPENAI"
      base_url: "https://api.openai.com/v1"
      model: "gpt-4.1-mini"
      api_key: "替换为你自己的api key"
    openrouter:
      env_prefix: "OPENROUTER"
      base_url: "https://openrouter.ai/api/v1"
      model: "openai/gpt-4.1-mini"
      api_key: "替换为你自己的api key"

# 飞书机器人凭证
feishu:
  app_id: "替换为你自己的app id"
  app_secret: "替换为你自己的app secret"

# 台账与纸交易：PostgreSQL（需 database.postgres.dsn）
database:
  postgres:
    # 当前默认主链路不依赖 PostgreSQL；核清迁移链后再填写 DSN。
    dsn: ""

# 长期记忆后端（MemoryAPI / FactStore）
# 默认 json：本地轻量 JSON/JSONL 保存，无需 PostgreSQL 即可运行。
# postgres 为可选后端；SQLite memory backend 已移除，遗留 memory_store.sqlite3 可安全删除。
memory:
  backend: "json"  # json | postgres

# 会话持久化（结构化状态 + 聊天历史 JSONL，无 PG 时仍可用）
session:
  # 默认写入 ~/.marketassagent/sessions
  # storage_dir: "/your/runtime/data/dir/sessions"

# Feature flags
# memory_api_only_mode: true 时历史读写只走 MemoryAPI，不再写 legacy JSON session
feature_flags:
  memory_api_only_mode: false

# Light Context 预算控制
agent_context:
  max_chars: 13434
  max_summary_chars: 1000
