# 跨资产默认参数（模板）
# 复制为 runtime/config/analysis_defaults.yaml 后在本地按需修改。

# 均线系统（按资产板块）
ma_system:
  crypto:
    short: 8
    mid: 21
    long: 55
  equity:
    short: 13
    mid: 34
    long: 89

# 通用 LLM 提供商配置（统一 agent 主模型入口）
llm:
  default_provider: "deepseek"
  providers:
    deepseek:
      env_prefix: "DEEPSEEK"
      base_url: "https://api.deepseek.com"
      model: "deepseek-flash"
      api_key: "替换为你自己的api key"
    openai:
      env_prefix: "OPENAI"
      base_url: "https://api.openai.com/v1"
      model: "gpt-4.1-mini"
      api_key: "替换为你自己的api key"
    openrouter:
      env_prefix: "OPENROUTER"
      base_url: "https://openrouter.ai/api/v1"
      model: "openai/gpt-4.1-mini"
      api_key: "替换为你自己的api key"

# 飞书机器人凭证
feishu:
  app_id: "替换为你自己的app id"
  app_secret: "替换为你自己的app secret"

# 台账与纸交易：PostgreSQL（需 database.postgres.dsn）
database:
  postgres:
    # 当前默认主链路不依赖 PostgreSQL；核清迁移链后再填写 DSN。
    dsn: ""

# JSONL 事件上下文预算。普通对话与历史检索不依赖 PostgreSQL。
agent_context:
  context_window_tokens: 65536
  reserve_tokens: 16384
  recent_fraction: 0.30
